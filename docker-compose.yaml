version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nextjs_dashboard_db
    environment:
      POSTGRES_USER: dashboard_admin
      POSTGRES_PASSWORD: secure_local_password
      POSTGRES_DB: dashboard_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: